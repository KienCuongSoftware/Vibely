name: Update README stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh production metrics in README
        run: node scripts/update-readme-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet README.md docs/stats/platform-stats.json; then
            echo "No stats changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/stats/platform-stats.json
          git commit -m "chore: refresh README production metrics"
          git push
