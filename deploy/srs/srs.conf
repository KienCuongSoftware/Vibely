# Vibely media server — SRS v6.0-r1 (image ossrs/srs:v6.0-r1), WebRTC only.
#
# Browsers publish with WHIP (POST /rtc/v1/whip/) and play with WHEP (POST /rtc/v1/whep/). Both are
# served on the HTTP API port and reach SRS only through the existing reverse proxy, which forwards
# exactly those two paths. Media (RTP over DTLS/SRTP) flows directly between the browser and
# rtc_server on port 8000 (UDP, TCP fallback). Video never passes through the Vibely backend.
#
# Everything environment-specific comes from environment variables (see deploy/vps/srs.env.example
# and the srs service in docker-compose.yml):
#   CANDIDATE                          public IP announced in SDP (required; Firefox needs an IP)
#   SRS_HTTP_API_LISTEN                e.g. 127.0.0.1:1985 in production (never public)
#   SRS_LISTEN                         RTMP port; unused by Vibely, bind it to 127.0.0.1
#   SRS_VHOST_HTTP_HOOKS_ON_PUBLISH    backend hook URL including ?hook_token=...
#   SRS_VHOST_HTTP_HOOKS_ON_UNPUBLISH  (same URL)
#   SRS_VHOST_HTTP_HOOKS_ON_PLAY       (same URL)
#   SRS_VHOST_HTTP_HOOKS_ON_STOP       (same URL)

listen              1935;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    # WHIP/WHEP are same-origin through the reverse proxy; no cross-origin access is needed.
    crossdomain     off;
}

# No HLS/HTTP-FLV in phase 3.
http_server {
    enabled         off;
}

rtc_server {
    enabled         on;
    # One UDP port multiplexes every WebRTC session.
    listen          8000;
    # WebRTC over TCP on the same port number, for networks that block UDP.
    tcp {
        enabled     on;
        listen      8000;
    }
    protocol        all;
    candidate       $CANDIDATE;
    # Never guess: behind Cloudflare the API host resolves to a Cloudflare IP, not this server.
    use_auto_detect_network_ip off;
    api_as_candidates off;
    ip_family       ipv4;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        # Pure WebRTC: no RTMP ingest or transcoding in phase 3.
        rtmp_to_rtc off;
        rtc_to_rtmp off;
        # Seconds without STUN before SRS drops a peer (host network loss is detected here).
        stun_timeout 30;
    }

    # Publish and play are authorized by the backend. The URLs below are placeholders that always
    # fail, so a missing environment override rejects every client instead of allowing it.
    http_hooks {
        enabled         on;
        on_publish      http://hook-url-not-configured.invalid/deny;
        on_unpublish    http://hook-url-not-configured.invalid/deny;
        on_play         http://hook-url-not-configured.invalid/deny;
        on_stop         http://hook-url-not-configured.invalid/deny;
    }
}
