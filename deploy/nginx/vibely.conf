# Vibely production — /etc/nginx/sites-available/vibely
# Requires map block in /etc/nginx/nginx.conf inside http { }:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Cloudflare terminates HTTPS; origin nginx listens on :80. Prefer client proto, else https:
#   map $http_x_forwarded_proto $vibely_forwarded_proto {
#       default $http_x_forwarded_proto;
#       ''      https;
#   }

# Per-client origin throttle (this file is included inside http { }).
# Use CF-Connecting-IP when present; otherwise the TCP peer (direct-to-origin).
map $http_cf_connecting_ip $vibely_rl_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $vibely_rl_key zone=vibely_auth:10m rate=8r/s;
limit_req_zone $vibely_rl_key zone=vibely_api:20m rate=25r/s;
limit_req_zone $vibely_rl_key zone=vibely_web:20m rate=40r/s;
limit_req_zone $vibely_rl_key zone=vibely_media:10m rate=5r/s;
limit_conn_zone $vibely_rl_key zone=vibely_conn:20m;

# Apex → luôn về www (giữ path + query)
server {
    listen 80;
    server_name vibely.sbs;
    return 301 https://www.vibely.sbs$request_uri;
}

server {
    listen 80;
    server_name www.vibely.sbs;

    root /var/www/vibely;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req_status 429;
    limit_conn_status 429;

    # --- Backend proxy (MUST include /oauth2/ and /login/oauth2/ or Google/Facebook login breaks) ---

    # Workers call backend on host :8080 directly (host.docker.internal).
    # Never expose job/moderation internal APIs through the public edge.
    location /api/internal/ {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=vibely_auth burst=20 nodelay;
        limit_conn vibely_conn 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=vibely_api burst=50 nodelay;
        limit_conn vibely_conn 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Legacy SPA builds called /oauth2/... (no /api). Redirect to /api/oauth2/... so OAuth
    # starts with 302 to Google/Facebook instead of index.html → React → home.
    location /oauth2/ {
        return 307 /api$request_uri;
    }

    location /login/oauth2/ {
        return 307 /api$request_uri;
    }

    location /share/ {
        limit_req zone=vibely_api burst=50 nodelay;
        limit_conn vibely_conn 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # LIVE video signaling → SRS (127.0.0.1:1985). Only the WHIP (publish) and WHEP (play) SDP
    # exchanges are exposed; the SRS management API (/api/v1/...) stays private. Publish and play
    # are authorized by the backend through SRS hooks (single-use / short-lived tokens in the query).
    # Media itself goes browser <-> SRS on 8000/udp (8000/tcp fallback), not through nginx/Cloudflare.
    location = /rtc/v1/whip/ {
        limit_except POST DELETE { deny all; }
        limit_req zone=vibely_media burst=10 nodelay;
        limit_conn vibely_conn 20;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:1985;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /rtc/v1/whep/ {
        limit_except POST DELETE { deny all; }
        limit_req zone=vibely_media burst=20 nodelay;
        limit_conn vibely_conn 20;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:1985;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # LIVE HLS fallback (phase 4, only used when LIVE_HLS_ENABLED=true and SRS writes HLS).
    # Files come from disk (SRS hls_path); nothing is proxied to SRS. Each playlist request is checked
    # by the backend (short-lived token scoped to that stream + the LIVE must still be open). Segment
    # names are only listed inside an authorized playlist and are deleted by SRS shortly after.
    # "live" in the paths is LIVE_MEDIA_APP (SRS app name).
    location ~ ^/live-hls/(s[0-9a-f]{32})\.m3u8$ {
        limit_except GET { deny all; }
        limit_req zone=vibely_api burst=50 nodelay;
        limit_conn vibely_conn 20;
        auth_request /_vibely_live_hls_auth;
        alias /var/lib/vibely/live-hls/live/$1.m3u8;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ ^/live-hls/(s[0-9a-f]{32}-[0-9]+\.ts)$ {
        limit_except GET { deny all; }
        limit_req zone=vibely_web burst=80 nodelay;
        limit_conn vibely_conn 20;
        alias /var/lib/vibely/live-hls/live/$1;
        default_type video/mp2t;
        add_header Cache-Control "private, max-age=60" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /live-hls/ {
        return 404;
    }

    location = /_vibely_live_hls_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/api/live-media/hls-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Only nginx's auth_request above needs the HLS check; keep it off the public edge.
    location = /api/live-media/hls-auth {
        return 404;
    }

    # Exact match — avoids 301 /ws -> /ws/ (browsers do not follow WS redirects)
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Hashed Vite assets — never fall back to index.html (that causes MIME text/html on 404).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback — keep last so /oauth2/, /api/, and /assets/ win
    location / {
        limit_req zone=vibely_web burst=80 nodelay;
        limit_conn vibely_conn 40;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
