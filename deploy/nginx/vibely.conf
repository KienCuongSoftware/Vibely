# Vibely production — /etc/nginx/sites-available/vibely
# Requires map block in /etc/nginx/nginx.conf inside http { }:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Cloudflare terminates HTTPS; origin nginx listens on :80. Prefer client proto, else https:
#   map $http_x_forwarded_proto $vibely_forwarded_proto {
#       default $http_x_forwarded_proto;
#       ''      https;
#   }

# Per-client origin throttle (this file is included inside http { }).
# Use CF-Connecting-IP when present; otherwise the TCP peer (direct-to-origin).
map $http_cf_connecting_ip $vibely_rl_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $vibely_rl_key zone=vibely_auth:10m rate=8r/s;
limit_req_zone $vibely_rl_key zone=vibely_api:20m rate=25r/s;
limit_req_zone $vibely_rl_key zone=vibely_web:20m rate=40r/s;
limit_conn_zone $vibely_rl_key zone=vibely_conn:20m;

# Apex → luôn về www (giữ path + query)
server {
    listen 80;
    server_name vibely.sbs;
    return 301 https://www.vibely.sbs$request_uri;
}

server {
    listen 80;
    server_name www.vibely.sbs;

    root /var/www/vibely;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req_status 429;
    limit_conn_status 429;

    # --- Backend proxy (MUST include /oauth2/ and /login/oauth2/ or Google/Facebook login breaks) ---

    # Workers call backend on host :8080 directly (host.docker.internal).
    # Never expose job/moderation internal APIs through the public edge.
    location /api/internal/ {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=vibely_auth burst=20 nodelay;
        limit_conn vibely_conn 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=vibely_api burst=50 nodelay;
        limit_conn vibely_conn 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Legacy SPA builds called /oauth2/... (no /api). Redirect to /api/oauth2/... so OAuth
    # starts with 302 to Google/Facebook instead of index.html → React → home.
    location /oauth2/ {
        return 307 /api$request_uri;
    }

    location /login/oauth2/ {
        return 307 /api$request_uri;
    }

    location /share/ {
        limit_req zone=vibely_api burst=50 nodelay;
        limit_conn vibely_conn 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Exact match — avoids 301 /ws -> /ws/ (browsers do not follow WS redirects)
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Hashed Vite assets — never fall back to index.html (that causes MIME text/html on 404).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback — keep last so /oauth2/, /api/, and /assets/ win
    location / {
        limit_req zone=vibely_web burst=80 nodelay;
        limit_conn vibely_conn 40;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
