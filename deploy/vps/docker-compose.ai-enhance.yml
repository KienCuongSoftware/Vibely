# AI Enhancement worker — place next to /opt/vibely/vibely.env
# Usage:
#   cd /opt/vibely
#   docker compose -f docker-compose.ai-enhance.yml pull
#   docker compose -f docker-compose.ai-enhance.yml up -d
#
# Do NOT use ${VAR} for secrets here — empty host/.env overrides env_file.
# Tokens and AWS keys come from vibely.env (APP_ENHANCEMENT_*, AWS_*).

services:
  ai-enhance-worker:
    image: kiencuongsoftware/vibely-ai-enhance:latest
    container_name: vibely-ai-enhance-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - vibely.env
    environment:
      VIBELY_API_BASE: http://host.docker.internal:8080
      ENHANCE_RABBITMQ_ENABLED: "false"
      ENHANCE_POLL_SECONDS: "5"
      ENHANCE_WORK_DIR: /var/lib/vibely-enhance/workspace
      ENHANCE_MIN_FREE_GB: "5"
      ENHANCE_KEEP_WORKSPACE: "false"
      LOG_LEVEL: INFO
    volumes:
      - ai_enhance_workspace:/var/lib/vibely-enhance/workspace
    healthcheck:
      test: ["CMD-SHELL", "ffmpeg -version >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ai_enhance_workspace:
